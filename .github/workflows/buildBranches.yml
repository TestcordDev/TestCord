name: Build Branches

on:
    push:
        branches:
            - main
            - dev
            - dev2
            - translation
    workflow_dispatch:
        inputs:
            branch:
                type: choice
                description: "Branch to build and upload"
                options:
                    - main
                    - dev
                    - translation
                default: "dev"

env:
    FORCE_COLOR: true
    GITHUB_TOKEN: ${{ secrets.ETOKEN }}
    REPO: TestcordDev/TestCord-Builds
    USERNAME: GitHub-Actions

permissions:
    contents: write

jobs:
    Build:
        name: Build TestCord
        runs-on: ubuntu-latest
        if: github.repository == 'TestcordDev/TestCord'

        steps:
            - uses: actions/checkout@v6
              with:
                  ref: ${{ github.event.inputs.branch || github.ref }}

            - uses: pnpm/action-setup@v6

            - name: Use Node.js 24
              uses: actions/setup-node@v6
              with:
                  node-version: 24
                  cache: "pnpm"

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            - name: Build web
              run: pnpm buildWebStandalone

            - name: Build
              run: pnpm buildStandalone

            - name: Generate plugin lists
              run: |
                  pnpm generatePluginJson dist/plugins.json
                  pnpm generateEquicordPluginJson dist/equicordplugins.json
                  pnpm generateVencordPluginJson dist/vencordplugins.json
                  pnpm generateTestcordPluginJson dist/testcordplugins.json
                  pnpm generateDevsList dist/devs.json

            - name: Upload to Testbuilds repo
              if: ${{ vars.ACT != 'true' }}
              run: |
                  BRANCH="${{ github.event.inputs.branch || github.ref_name }}"
                  COMMIT_SHA=$(git rev-parse --short HEAD)

                  git config --global user.name "GitHub-Actions"
                  git config --global user.email actions@github.com
                  git clone https://$USERNAME:$GITHUB_TOKEN@github.com/$REPO.git TestCord-builds
                  cd TestCord-builds

                  if git ls-remote --exit-code --heads origin "$BRANCH" > /dev/null 2>&1; then
                      git fetch --depth 1 origin "$BRANCH"
                      git checkout "$BRANCH"
                  else
                      git checkout --orphan "$BRANCH"
                  fi

                  cp -r ../dist/* .
                  find . -size 0 -delete

                  mkdir -p userscript
                  mv Equicord.user.* userscript/
                  mv desktop.asar desktop/
                  mv equibop.asar equibop/
                  mv extension-*.zip browser/

                  git add -A
                  git commit -m "Builds for https://github.com/$GITHUB_REPOSITORY/commit/$COMMIT_SHA"
                  git push --force origin "$BRANCH"
