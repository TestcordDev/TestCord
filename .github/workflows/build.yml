name: Release
on:
    push:
        branches:
            - main

env:
    FORCE_COLOR: true
    GITHUB_TOKEN: ${{ secrets.ETOKEN }}
    GH_TOKEN: ${{ github.token }}
    REPO: TestcordDev/TestCord
    USERNAME: GitHub-Actions

permissions:
    contents: write

jobs:
    Build:
        name: Build Testcord
        runs-on: ubuntu-latest

        steps:
            - uses: actions/checkout@v7

            - name: Setup PNPM
              uses: pnpm/setup@v2.1.0
              with:
                  runtime: node@v24
                  require-lockfile: true

            - name: Build web
              run: pnpm buildWebStandalone

            - name: Build
              run: pnpm buildStandalone

            - name: Generate plugin lists
              run: |
                  pnpm generatePluginJson dist/plugins.json
                  pnpm generateEquicordPluginJson dist/equicordplugins.json
                  pnpm generateVencordPluginJson dist/vencordplugins.json
                  pnpm generateTestcordPluginJson dist/testcordplugins.json
                  pnpm generateDevsList dist/devs.json

            - name: Collect files to be released
              run: |
                  cd dist
                  mkdir release

                  cp browser/browser.* release
                  cp Equicord.user.{js,js.LEGAL.txt} release

                  # copy the plugin data jsons, the extension zips and the desktop/equibop asars
                  cp *.{json,zip,asar} release

                  # legacy un-asared files
                  cp desktop/* release
                  for file in equibop/*; do
                    filename=$(basename "$file")
                    cp "$file" "release/equibop${filename^}"
                  done

                  find release -size 0 -delete
                  rm release/package.json
                  rm release/*.map

            - name: Create or update release
              run: |
                  if gh release view latest >/dev/null 2>&1; then
                      echo "Release 'latest' exists, uploading files..."
                  else
                      echo "Creating release 'latest'..."
                      gh release create latest --title "Testcord Latest" --notes "Automated release" --generate-notes
                  fi

            - name: Upload to latest release
              run: |
                  gh release upload latest --clobber dist/release/*
